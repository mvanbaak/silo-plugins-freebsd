name: catalog

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/catalog.yml"

permissions:
  contents: write

concurrency:
  group: catalog
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ARCHES: "amd64 arm64"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "stable"

      - name: Build changed plugins
        id: build
        run: |
          ts=$(date -u +%Y%m%dT%H%M%SZ)
          echo "tag=catalog-${ts}" >> "$GITHUB_OUTPUT"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/catalog-${ts}"
          ./scripts/build-catalog.sh "$base"

      - name: Detect changes
        id: detect
        run: |
          if [ -s built.txt ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Built:"; cat built.txt
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new plugin versions."
          fi

      - name: Publish release
        if: steps.detect.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "FreeBSD builds published in this run:"
            echo
            while read -r id ver arch; do echo "- \`${id}\` ${ver} (${arch})"; done < built.txt
            echo
            echo "_Built from the upstream catalog at https://github.com/Silo-Server/silo-plugins_"
          } > notes.md
          gh release create "${{ steps.build.outputs.tag }}" \
            --title "Silo plugins (FreeBSD) — $(date -u '+%Y-%m-%d %H:%M UTC')" \
            --notes-file notes.md
          gh release upload "${{ steps.build.outputs.tag }}" dist/*

      - name: Commit the updated catalog
        if: steps.detect.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "catalog: update $(wc -l < built.txt | tr -d ' ') plugin build(s)"
          git push
