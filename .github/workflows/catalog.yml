name: catalog

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/catalog.yml"

permissions:
  contents: read

concurrency:
  group: catalog
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      ARCHES: "amd64 arm64"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "stable"

      - name: Build changed plugins
        id: build
        run: |
          ts=$(date -u +%Y%m%dT%H%M%SZ)
          echo "tag=catalog-${ts}" >> "$GITHUB_OUTPUT"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/catalog-${ts}"
          BUNDLE_URL="${base}/plugin.sigstore.json" ./scripts/build-catalog.sh "$base"

      - name: Detect changes
        id: detect
        run: |
          if [ -s built.txt ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Built:"; cat built.txt
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new plugin versions."
          fi

      - name: Attest built binaries
        if: steps.detect.outputs.changed == 'true'
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: "dist/*"

      - name: Create plugin bundle
        if: steps.detect.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          : > plugin.sigstore.json
          for f in dist/*; do
            [ -f "$f" ] || continue
            gh attestation download "$f" -R "${GITHUB_REPOSITORY}"
          done
          cat sha256-*.jsonl > plugin.sigstore.json 2>/dev/null || true
          rm -f sha256-*.jsonl
          test -s plugin.sigstore.json

      - name: Verify bundles
        if: steps.detect.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          for f in dist/*; do
            [ -f "$f" ] || continue
            gh attestation verify "$f" \
              --repo "${GITHUB_REPOSITORY}" \
              --bundle plugin.sigstore.json \
              --cert-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/catalog.yml@refs/heads/main" \
              --source-ref refs/heads/main \
              --cert-oidc-issuer https://token.actions.githubusercontent.com \
              --deny-self-hosted-runners
          done

      - name: Publish release
        if: steps.detect.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "FreeBSD builds published in this run:"
            echo
            while read -r id ver arch; do echo "- \`${id}\` ${ver} (${arch})"; done < built.txt
            echo
            echo "_Built from the upstream catalog at https://github.com/Silo-Server/silo-plugins_"
          } > notes.md
          gh release create "${{ steps.build.outputs.tag }}" \
            --title "Silo plugins (FreeBSD) — $(date -u '+%Y-%m-%d %H:%M UTC')" \
            --notes-file notes.md
          gh release upload "${{ steps.build.outputs.tag }}" dist/* plugin.sigstore.json

      - name: Commit the updated catalog
        if: steps.detect.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "catalog: update $(wc -l < built.txt | tr -d ' ') plugin build(s)"
          git push