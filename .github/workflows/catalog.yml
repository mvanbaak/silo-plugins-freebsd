name: catalog

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/catalog.yml"
      - "tests/**"

permissions:
  contents: read

concurrency:
  group: catalog
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version: "stable"
          cache: false
      - name: Run fixture tests
        run: python3 -m unittest discover -s tests

  build:
    needs: test
    if: github.repository == 'mvanbaak/silo-plugins-freebsd'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      ARCHES: "amd64 arm64"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version: "stable"
          cache: false

      - name: Build catalog tool
        run: |
          set -eu
          ( cd "$GITHUB_WORKSPACE/scripts/silocatalog" && go build -o "$RUNNER_TEMP/silocatalog" . )

      - name: Resolve the plugins to build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # Repositories listed in scripts/plugins.txt, because neither Silo
          # feed ships them. Each one is resolved to its latest GitHub release;
          # the builder clones v<manifest.version>, so the tag and the manifest
          # must agree.
          entries="$RUNNER_TEMP/plugin-entries.jsonl"
          : > "$entries"
          while IFS= read -r line || [ -n "$line" ]; do
            url=${line%%#*}
            url=$(printf '%s' "$url" | tr -d '[:space:]')
            [ -n "$url" ] || continue
            case "$url" in
              https://github.com/*/*) ;;
              *) echo "::error::$url: not an https://github.com/OWNER/REPO URL"; exit 1 ;;
            esac
            repo=${url#https://github.com/}
            case "$repo" in
              */*/*|*' '*|*'?'*|*'#'*) echo "::error::$url: not an https://github.com/OWNER/REPO URL"; exit 1 ;;
            esac
            tag=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$repo/releases/latest" | jq -r '.tag_name // empty')
            case "$tag" in
              v?*) ;;
              *) echo "::error::$url: latest GitHub release tag '$tag' is not v<version>"; exit 1 ;;
            esac
            if ! curl -fsSL "https://raw.githubusercontent.com/$repo/$tag/manifest.json" \
              -o "$RUNNER_TEMP/plugin-manifest.json"; then
              echo "::error::$url: no manifest.json at $tag"; exit 1
            fi
            # A plugin's own manifest.json is protojson, so its enums are names;
            # catalog indexes are decoded with encoding/json, which needs numbers.
            if ! "$RUNNER_TEMP/silocatalog" normalize "$RUNNER_TEMP/plugin-manifest.json" \
              > "$RUNNER_TEMP/plugin-manifest.json.normalized"; then
              echo "::error::$url: manifest.json at $tag does not normalize"
              exit 1
            fi
            mv "$RUNNER_TEMP/plugin-manifest.json.normalized" \
              "$RUNNER_TEMP/plugin-manifest.json"
            if ! problem=$(jq -r --arg version "${tag#v}" '
              if type != "object" then "manifest.json is not a JSON object"
              elif (.plugin_id | type) != "string" or .plugin_id == "" then "manifest.plugin_id is not a non-empty string"
              elif .version != $version then "manifest.version \(.version // "missing") does not match release tag v\($version)"
              else empty end
            ' "$RUNNER_TEMP/plugin-manifest.json" 2>&1); then
              echo "::error::$url: $problem"
              exit 1
            fi
            if [ -n "$problem" ]; then
              echo "::error::$url: $problem"
              exit 1
            fi
            jq -c --arg url "$url" '{manifest: ., repo_url: $url}' \
              "$RUNNER_TEMP/plugin-manifest.json" >> "$entries"
          done < "$GITHUB_WORKSPACE/scripts/plugins.txt"
          jq -s '{plugins: .}' "$entries" > "$RUNNER_TEMP/plugins.json"
          jq -n --slurpfile extra "$RUNNER_TEMP/plugins.json" \
            -f "$GITHUB_WORKSPACE/scripts/catalog.jq" > "$RUNNER_TEMP/upstream.json"

      - name: Build changed plugins
        id: build
        run: |
          set -eu
          ts=$(date -u +%Y%m%dT%H%M%SZ)
          echo "tag=catalog-${ts}" >> "$GITHUB_OUTPUT"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/catalog-${ts}"
          BUILT="$RUNNER_TEMP/built.txt" \
            UPSTREAM="file://$RUNNER_TEMP/upstream.json" \
            ./scripts/build-catalog.sh "$base"
          cp "$RUNNER_TEMP/built.txt" built.txt

      - name: Verify catalogs decode like Silo
        run: |
          set -eu
          if ! "$RUNNER_TEMP/silocatalog" check "$GITHUB_WORKSPACE/manifest.json"; then
            echo "::error::manifest.json does not decode as Silo reads it"
            exit 1
          fi

      - name: Detect changes
        id: detect
        run: |
          if [ -s built.txt ]; then
            echo "built=true" >> "$GITHUB_OUTPUT"
            echo "Built:"; cat built.txt
          else
            echo "built=false" >> "$GITHUB_OUTPUT"
            echo "No new plugin versions."
          fi
          # Dropping a plugin needs no build, so the catalog commit is gated on
          # the file changing, not on binaries having been produced.
          if git diff --quiet -- manifest.json; then
            echo "catalog=false" >> "$GITHUB_OUTPUT"
          else
            echo "catalog=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- manifest.json
          fi

      - name: Attest built binaries
        if: steps.detect.outputs.built == 'true' && github.ref == 'refs/heads/main'
        id: attest
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: "dist/*"

      - name: Publish bundle
        if: steps.detect.outputs.built == 'true' && github.ref == 'refs/heads/main'
        run: |
          set -eu
          cp "${{ steps.attest.outputs.bundle-path }}" plugin.sigstore.json
          test -s plugin.sigstore.json

      - name: Verify bundles
        if: steps.detect.outputs.built == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          for f in dist/*; do
            [ -f "$f" ] || continue
            gh attestation verify "$f" \
              --repo "${GITHUB_REPOSITORY}" \
              --bundle plugin.sigstore.json \
              --cert-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/catalog.yml@refs/heads/main" \
              --source-ref refs/heads/main \
              --source-digest "${{ github.sha }}" \
              --cert-oidc-issuer https://token.actions.githubusercontent.com \
              --deny-self-hosted-runners
          done

      - name: Publish release
        if: steps.detect.outputs.built == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "FreeBSD builds published in this run:"
            echo
            while read -r id ver arch; do echo "- \`${id}\` ${ver} (${arch})"; done < built.txt
            echo
            echo "_Built from the plugins listed in scripts/plugins.txt_"
          } > notes.md
          gh release create "${{ steps.build.outputs.tag }}" \
            --title "Silo plugins (FreeBSD) — $(date -u '+%Y-%m-%d %H:%M UTC')" \
            --notes-file notes.md
          gh release upload "${{ steps.build.outputs.tag }}" dist/* plugin.sigstore.json

      - name: Commit the updated catalog
        if: steps.detect.outputs.catalog == 'true' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          if [ -s built.txt ]; then
            msg="catalog: update $(wc -l < built.txt | tr -d ' ') plugin build(s)"
          else
            msg="catalog: drop the plugins no longer listed"
          fi
          git commit -m "$msg"
          git push
