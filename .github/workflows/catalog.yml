name: catalog

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/catalog.yml"
      - "tests/**"

permissions:
  contents: read

concurrency:
  group: catalog
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version: "stable"
          cache: false
      - name: Run fixture tests
        run: python3 -m unittest discover -s tests

  build:
    needs: test
    if: github.repository == 'mvanbaak/silo-plugins-freebsd'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      ARCHES: "amd64 arm64"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version: "stable"
          cache: false

      - name: Fetch upstream catalogs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          curl -fsSL https://raw.githubusercontent.com/Silo-Server/silo-plugins/main/manifest.json -o "$RUNNER_TEMP/official.json"
          curl -fsSL https://raw.githubusercontent.com/Silo-Community/silo-plugins/main/manifest.json -o "$RUNNER_TEMP/community.json"

          # Repositories the community catalog carries beyond the Silo-Community
          # feed. Each one is resolved to its latest GitHub release; the builder
          # clones v<manifest.version>, so the tag and the manifest must agree.
          entries="$RUNNER_TEMP/community-extra-entries.jsonl"
          : > "$entries"
          while IFS= read -r line || [ -n "$line" ]; do
            url=${line%%#*}
            url=$(printf '%s' "$url" | tr -d '[:space:]')
            [ -n "$url" ] || continue
            case "$url" in
              https://github.com/*/*) ;;
              *) echo "::error::$url: not an https://github.com/OWNER/REPO URL"; exit 1 ;;
            esac
            repo=${url#https://github.com/}
            case "$repo" in
              */*/*|*' '*|*'?'*|*'#'*) echo "::error::$url: not an https://github.com/OWNER/REPO URL"; exit 1 ;;
            esac
            tag=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$repo/releases/latest" | jq -r '.tag_name // empty')
            case "$tag" in
              v?*) ;;
              *) echo "::error::$url: latest GitHub release tag '$tag' is not v<version>"; exit 1 ;;
            esac
            if ! curl -fsSL "https://raw.githubusercontent.com/$repo/$tag/manifest.json" \
              -o "$RUNNER_TEMP/community-extra-manifest.json"; then
              echo "::error::$url: no manifest.json at $tag"; exit 1
            fi
            if ! problem=$(jq -r --arg version "${tag#v}" '
              if type != "object" then "manifest.json is not a JSON object"
              elif (.plugin_id | type) != "string" or .plugin_id == "" then "manifest.plugin_id is not a non-empty string"
              elif .version != $version then "manifest.version \(.version // "missing") does not match release tag v\($version)"
              else empty end
            ' "$RUNNER_TEMP/community-extra-manifest.json" 2>&1); then
              echo "::error::$url: $problem"
              exit 1
            fi
            if [ -n "$problem" ]; then
              echo "::error::$url: $problem"
              exit 1
            fi
            jq -c --arg url "$url" '{manifest: ., repo_url: $url}' \
              "$RUNNER_TEMP/community-extra-manifest.json" >> "$entries"
          done < "$GITHUB_WORKSPACE/scripts/community-extra.txt"
          jq -s '{plugins: .}' "$entries" > "$RUNNER_TEMP/community-extra.json"

          jq -n --slurpfile official "$RUNNER_TEMP/official.json" -f "$GITHUB_WORKSPACE/scripts/official-catalog.jq" > "$RUNNER_TEMP/upstream-official.json"
          jq -n --slurpfile community "$RUNNER_TEMP/community.json" \
            --slurpfile extra "$RUNNER_TEMP/community-extra.json" \
            -f "$GITHUB_WORKSPACE/scripts/community-catalog.jq" > "$RUNNER_TEMP/upstream-community.json"
          # Both catalogs publish binaries into one dist/ and one release, so an
          # id in both feeds would overwrite a binary one manifest already lists.
          dup=$(jq -nr \
            --slurpfile o "$RUNNER_TEMP/upstream-official.json" \
            --slurpfile c "$RUNNER_TEMP/upstream-community.json" '
            [($o[0].plugins[].manifest.plugin_id)] as $a
            | [($c[0].plugins[].manifest.plugin_id)] as $b
            | [$a[] | select(. as $id | $b | index($id))] | join(",")')
          if [ -n "$dup" ]; then
            echo "::error::plugin ids in both catalogs: $dup"
            exit 1
          fi

      - name: Build changed plugins
        id: build
        run: |
          set -eu
          ts=$(date -u +%Y%m%dT%H%M%SZ)
          echo "tag=catalog-${ts}" >> "$GITHUB_OUTPUT"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/catalog-${ts}"
          BUNDLE_URL="${base}/plugin.sigstore.json" \
            UPSTREAM="file://$RUNNER_TEMP/upstream-official.json" \
            MANIFEST="$GITHUB_WORKSPACE/manifest.json" \
            BUILT="$RUNNER_TEMP/built-official.txt" \
            ./scripts/build-catalog.sh "$base"
          BUNDLE_URL="${base}/plugin.sigstore.json" \
            UPSTREAM="file://$RUNNER_TEMP/upstream-community.json" \
            MANIFEST="$GITHUB_WORKSPACE/community-manifest.json" \
            BUILT="$RUNNER_TEMP/built-community.txt" \
            ./scripts/build-catalog.sh "$base"
          cat "$RUNNER_TEMP/built-official.txt" "$RUNNER_TEMP/built-community.txt" > built.txt

      - name: Detect changes
        id: detect
        run: |
          if [ -s built.txt ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Built:"; cat built.txt
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new plugin versions."
          fi

      - name: Attest built binaries
        if: steps.detect.outputs.changed == 'true' && github.ref == 'refs/heads/main'
        id: attest
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: "dist/*"

      - name: Publish bundle
        if: steps.detect.outputs.changed == 'true' && github.ref == 'refs/heads/main'
        run: |
          set -eu
          cp "${{ steps.attest.outputs.bundle-path }}" plugin.sigstore.json
          test -s plugin.sigstore.json

      - name: Verify bundles
        if: steps.detect.outputs.changed == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          for f in dist/*; do
            [ -f "$f" ] || continue
            gh attestation verify "$f" \
              --repo "${GITHUB_REPOSITORY}" \
              --bundle plugin.sigstore.json \
              --cert-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/catalog.yml@refs/heads/main" \
              --source-ref refs/heads/main \
              --source-digest "${{ github.sha }}" \
              --cert-oidc-issuer https://token.actions.githubusercontent.com \
              --deny-self-hosted-runners
          done

      - name: Publish release
        if: steps.detect.outputs.changed == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "FreeBSD builds published in this run:"
            echo
            while read -r id ver arch; do echo "- \`${id}\` ${ver} (${arch})"; done < built.txt
            echo
            echo "_Built from the upstream catalogs at https://github.com/Silo-Server/silo-plugins and https://github.com/Silo-Community/silo-plugins_"
          } > notes.md
          gh release create "${{ steps.build.outputs.tag }}" \
            --title "Silo plugins (FreeBSD) — $(date -u '+%Y-%m-%d %H:%M UTC')" \
            --notes-file notes.md
          gh release upload "${{ steps.build.outputs.tag }}" dist/* plugin.sigstore.json

      - name: Commit the updated catalogs
        if: steps.detect.outputs.changed == 'true' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json community-manifest.json
          git commit -m "catalog: update $(wc -l < built.txt | tr -d ' ') plugin build(s)"
          git push
